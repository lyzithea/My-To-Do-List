<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    
    <header>
        <h1>My To Do List</h1>
        <details>
        <summary>Change color</summary>

        <div class="theme-container">
            <button id="purple-theme" class="theme-button">Purple</button>
            <button id="blue-theme" class="theme-button">Blue</button>
            <button id="green-theme" class="theme-button">Green</button>
        </div>
        </details>
    </header>


    <main>
        <input type="text" placeholder="New Task" id="task-Input" required>
        <br>
        <button type="button" id="add-Button">Add</button>

        <ul id="entry-List">

        </ul>
    </main>

   

    <script src="index.js"></script>
</body>
</html>
